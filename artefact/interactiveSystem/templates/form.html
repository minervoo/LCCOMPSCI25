<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emissions Data Collection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='formstyle.css') }}">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script>
    
    <script>
        // Firebase configuration details
        const firebaseConfig = {
            apiKey: "AIzaSyBi7nrLQhLARL0YjvFbM97cWdi-34xHhfU", 
            authDomain: "lccs-project-1-e8478.firebaseapp.com",
            databaseURL: "https://lccs-project-1-e8478-default-rtdb.firebaseio.com",
            projectId: "lccs-project-1-e8478",
            storageBucket: "lccs-project-1-e8478.firebasestorage.app",
            messagingSenderId: "650193154382",
            appId: "1:650193154382:web:542c6d50d82f6934b26e1f"
        };

        // Initialize Firebase and set up the database connection
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        console.log("Firebase initialized:", app);

        // Function to validate the form and handle submission
        function validateForm(event) {
            event.preventDefault(); // Stop the form from submitting the usual way

            // Get the values entered by the user
            const name = document.getElementById('name').value;
            const carTrips = document.getElementById('carTrips').value;
            const energyUsage = document.getElementById('energyUsage').value;
            const recycles = document.querySelector('input[name="recycles"]:checked').value;

            // Create an object to store the data
            const data = {
                name: name,
                carTrips: carTrips,
                energyUsage: energyUsage,
                recycles: recycles
            };

            // Save the data to Firebase Realtime Database
            database.ref('emissionsData').push(data)
                .then(() => {
                    // If successful, hide the form and show a thank-you message
                    document.querySelector('.FormContainer').style.display = 'none';
                    document.querySelector('.ThankYouMessage').style.display = 'block';

                    // Refresh the pie chart with the new data
                    loadPieChart();
                })
                .catch((error) => {
                    // If there's an error, log it and show an alert
                    console.error("Error writing data to Firebase:", error);
                    alert("There was an error submitting your data. Please try again later.");
                });

            return false; // Prevent the page from refreshing
        }

        // Function to load and display the pie chart
        function loadPieChart() {
            // Get a reference to the 'emissionsData' node in Firebase
            const emissionsRef = database.ref('emissionsData');

            emissionsRef.once('value', (snapshot) => {
                const data = snapshot.val();

                if (!data) {
                    console.log("No data available.");
                    document.getElementById('pieChartContainer').innerHTML = "<p>No data available to display.</p>";
                    return;
                }

                // Count the number of "yes" and "no" responses for recycling
                let recycleYes = 0;
                let recycleNo = 0;

                for (const key in data) {
                    if (data[key].recycles === "yes") {
                        recycleYes++;
                    } else if (data[key].recycles === "no") {
                        recycleNo++;
                    }
                }

                // Prepare the data for the pie chart
                const chartData = [{
                    values: [recycleYes, recycleNo],
                    labels: ['Recycle: Yes', 'Recycle: No'],
                    type: 'pie',
                    marker: {
                        colors: ['#4CAF50', '#F44336'] // Green for "Yes", Red for "No"
                    },
                    textinfo: 'label+percent',
                    hoverinfo: 'label+value'
                }];

                const layout = {
                    title: 'Recycling Data Analysis',
                    height: 400,
                    width: 500
                };

                // Render the pie chart using Plotly
                Plotly.newPlot('pieChartContainer', chartData, layout);
            });
        }

        // Load the pie chart when the page loads
        loadPieChart();
    </script>
</head>
<body>
    <!-- Navigation bar -->
    <ul class="nav">
        <li><a href="/">Home</a></li>
        <li><a href="/recs">Recommendations</a></li>
        <li><a href="/form" class="active">Form</a></li>
    </ul>

    <!-- Page title and description -->
    <div class="PageTitle">
        <h1>Emissions Data Collection</h1>
        <hr />
        <p>Help us gather data to analyze CO2 emissions.</p>
    </div>

    <!-- Form for data collection -->
    <div class="FormContainer">
        <form onsubmit="return validateForm(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="carTrips">Number of car trips per week:</label>
            <input type="number" id="carTrips" name="carTrips" required>

            <label for="energyUsage">Monthly energy usage (in kWh):</label>
            <input type="number" id="energyUsage" name="energyUsage" required>

            <label for="recycles">Do you recycle?</label>
            <div>
                <input type="radio" id="recyclesYes" name="recycles" value="yes" required>
                <label for="recyclesYes">Yes</label>

                <input type="radio" id="recyclesNo" name="recycles" value="no">
                <label for="recyclesNo">No</label>
            </div>

            <input type="submit" value="Submit">
        </form>
    </div>

    <!-- Thank you message displayed after form submission -->
    <div class="ThankYouMessage" style="display: none;">
        <h2>Thank you for your response!</h2>
        <p>Your data has been successfully submitted.</p>
    </div>

    <!-- Container for the pie chart -->
    <div id="pieChartContainer" style="width: 100%; max-width: 600px; margin: 50px auto;"></div>

    <!-- Footer with contact information and social media links -->
    <div class="footer">
        <p>Contact Us: dataanalysis@LCStudent.com</p>
        <a href="https://www.facebook.com/" class="fa fa-facebook"></a>
        <a href="https://twitter.com/?lang=en" class="fa fa-twitter"></a>
    </div>
</body>
</html>
